<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG Insights · Siteholder Records</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Siteholder Records tools.">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('sh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>

:root{color-scheme:light;
  --bg:#f2f3f4;--surface:#ffffff;--ink:#0e0f11;--muted:#5b5f66;--line:#d8dadd;--accent:#2536ff;--on-ink:#ffffff;--ok:#12805c;--bad:#c4271c;--warn:#a86a00;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px);--logo:url("../logo.png")}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--surface:#17181b;--ink:#f1f2f3;--muted:#9b9fa7;--line:#2b2d32;--accent:#8a95ff;--on-ink:#0e0f11;--ok:#41c796;--bad:#ff6b5e;--warn:#e8b040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f11;--surface:#17181b;--ink:#f1f2f3;--muted:#9b9fa7;--line:#2b2d32;--accent:#8a95ff;--on-ink:#0e0f11;--ok:#41c796;--bad:#ff6b5e;--warn:#e8b040;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;padding-inline:var(--gutter)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,p{margin:0}
.wrap{max-width:1240px;margin-inline:auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:14px}
.logo{display:block;height:56px;aspect-ratio:480/272;background-color:currentColor;-webkit-mask:var(--logo) no-repeat center/contain;mask:var(--logo) no-repeat center/contain}
.theme{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;padding:4px;cursor:pointer}
.theme:hover{color:var(--ink)}
.theme .track{width:38px;height:22px;border-radius:99px;border:1.5px solid var(--ink);position:relative;flex:none}
.theme .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .2s}
.theme[aria-checked="true"] .track::after{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.theme .track::after,.tile,.tile .go{transition:none}}
main{padding-block:40px 72px;min-height:100vh;min-height:100svh}
.page-title{font-size:clamp(44px,9vw,120px);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;margin-bottom:32px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:260px;padding:26px 28px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink)}
.tile .k{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tile h2{font-size:clamp(28px,3.4vw,44px);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin-bottom:14px}
.tile p{color:var(--muted);font-size:16px;max-width:46ch}
.tile .go{font:500 13px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tile.feat{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.tile.feat .k,.tile.feat p{color:color-mix(in srgb,var(--on-ink) 70%,transparent)}
.tile.feat:hover{border-color:var(--accent)}
@media(min-width:760px){.tile.feat{grid-column:span 2}}
footer{border-top:1px solid var(--line);padding-block:32px 48px}
.legal{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8}
.legal a{border-bottom:1px solid currentColor}.legal a:hover{color:var(--accent)}

.page-title{font-size:clamp(44px,8vw,96px);margin-bottom:12px}
.who{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.who b{font-size:20px;font-weight:800;font-stretch:75%;text-transform:uppercase}
.who span{font:13px var(--mono);color:var(--muted)}.who span i{font-style:normal;color:var(--ink);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin-bottom:8px}
.stat b{font-size:44px;display:block}.stat small{display:block;font:11px var(--mono);color:var(--muted);margin-top:6px}
.chart{background:var(--surface);border:1px solid var(--line);padding:18px}
.chart svg{display:block;width:100%;height:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars i{flex:1;background:var(--ink);min-height:2px;opacity:.82;cursor:default}.bars i:hover{opacity:1}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line);padding:8px 12px;font:13px var(--mono);color:var(--muted);white-space:nowrap;display:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}#tip b{color:var(--ink)}
.axis{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:13px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:240px}
td:first-child{display:flex;gap:12px;align-items:center}
td img{width:30px;height:44px;object-fit:cover;background:var(--line);flex:none}
.tw{overflow-x:auto}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px 40px}
.aud h3{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font:12px var(--mono);margin:7px 0}
.ar s{display:block;height:8px;background:var(--line);text-decoration:none}.ar s i{display:block;height:100%;background:var(--ink)}
.ar span:last-child{text-align:right;color:var(--muted)}
.err{color:var(--bad)}
.stat{background:var(--surface);border:1px solid var(--line);padding:18px 20px}
.stat span{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2.sec{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h2.sec small{font-size:11px;letter-spacing:.04em;text-transform:none}
.btn{display:inline-flex;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--on-ink)}.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.lhs{display:flex;align-items:center;gap:18px;min-width:0}.adminlink{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:8px 12px;white-space:nowrap}.adminlink:hover{color:var(--ink);border-color:var(--ink)}@media(max-width:520px){.lhs{gap:10px}.adminlink{padding:7px 9px;letter-spacing:.04em}}
</style></head>
<body>
<header class="top"><div class="wrap">
  <div class="lhs"><a class="adminlink" href="../">&larr; Admin</a><a class="brand" href="../../" aria-label="Siteholder Records home"><span class="logo" role="img" aria-label="siteHolder"></span></a></div>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span class="track"></span><span id="theme-label">Light</span></button>
</div></header>
<main class="wrap">
<div class="bar"><div><h1 class="page-title">IG Insights</h1><div class="who" id="who"></div></div><button class="btn" id="upd" type="button">&#8635; Update</button></div>
<p class="note" id="msg">Loading from Instagram&hellip;</p>
<div id="out"></div>
</main>
<footer><div class="wrap"><p class="legal" id="foot">&copy; Siteholder Records, Chicago. <a href="../">Back to admin</a></p></div></footer>
<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n==null?'\u2014':Number(n).toLocaleString('en-US')}
var D=null,sortK='date',sortDir=-1;
function demo(){var d=[],f={},r=[],i;for(i=27;i>=0;i--){var t=new Date(Date.now()-i*864e5).toLocaleDateString('en-CA');d.push({d:t,v:Math.round(Math.random()*900)})}
  f[new Date().toLocaleDateString('en-CA')]=0;
  for(i=0;i<8;i++)r.push({id:i,cap:'Sample reel '+(i+1),url:'#',thumb:'',date:new Date(Date.now()-i*2*864e5).toLocaleDateString('en-CA'),views:Math.round(Math.random()*2000),reach:Math.round(Math.random()*1500),likes:Math.round(Math.random()*40),comments:Math.round(Math.random()*5),shares:Math.round(Math.random()*5),saves:Math.round(Math.random()*20),watch:5000+Math.random()*8000,skip:50+Math.round(Math.random()*20)});
  return {fetchedAt:new Date().toISOString(),profile:{username:'siteholderrecords',followers_count:0,follows_count:0,media_count:r.length},followers:f,last7:{views:0,reach:0,accounts_engaged:0,total_interactions:0,profile_links_taps:0},last28:{views:0,reach:0,accounts_engaged:0,total_interactions:0,profile_links_taps:0},reachDaily:d,reels:r,demo:{country:[{k:'US',v:60},{k:'GB',v:20},{k:'DE',v:10}],city:[{k:'Chicago, Illinois',v:30},{k:'London, England',v:20}],age:[{k:'25-34',v:40},{k:'35-44',v:35},{k:'45-54',v:25}],gender:[{k:'M',v:70},{k:'F',v:10},{k:'U',v:20}]},errors:{}}}
function load(refresh){
  $('upd').disabled=true;$('msg').textContent='Loading from Instagram\u2026';
  var demoMode=/[?&]demo/.test(location.search);
  (demoMode?Promise.resolve(demo()):fetch('../api/insights'+(refresh?'?refresh=1':''),{cache:'no-store'}).then(function(r){if(!r.ok)return r.json().catch(function(){return {error:'HTTP '+r.status}}).then(function(j){throw new Error(j.error||('HTTP '+r.status))});return r.json()}))
  .then(function(j){D=j;render();$('msg').textContent=''}).catch(function(e){$('msg').innerHTML='<span class="err">Could not load insights: '+esc(e.message)+'</span>'}).then(function(){$('upd').disabled=false});
}
function render(){
  var p=D.profile,a=D.last7||{},b=D.last28||{};
  $('who').innerHTML='<b>@'+esc(p.username)+'</b><span><i>'+fmt(p.followers_count)+'</i> followers</span><span><i>'+fmt(p.follows_count)+'</i> following</span><span><i>'+fmt(p.media_count)+'</i> posts</span>';
  var tiles=[['Views','views'],['Accounts reached','reach'],['Accounts engaged','accounts_engaged'],['Interactions','total_interactions'],['Profile link taps','profile_links_taps']];
  var h='<h2 class="sec">Total followers <small>'+esc(Object.keys(D.followers)[0]||'')+' \u2013 today</small></h2><div class="chart">'+followers()+'</div><p class="note">Instagram only reports today\u2019s total, so this chart is built from a count saved once a day, starting the day this page was first opened.</p>';
  h+='<h2 class="sec">Last 7 days <small>28 days in grey</small></h2><div class="sum">'+tiles.map(function(t){return '<div class="stat"><b>'+fmt(a[t[1]])+'</b><span>'+t[0]+'</span><small>'+fmt(b[t[1]])+' in 28 days</small></div>'}).join('')+'</div>';
  if(D.reachDaily){var mx=Math.max.apply(null,D.reachDaily.map(function(x){return x.v}))||1;h+='<h2 class="sec">Accounts reached per day <small>last 28 days</small></h2><div class="chart"><div class="bars">'+D.reachDaily.map(function(x){return '<i data-tip="'+esc(x.d)+'|'+x.v+'" style="height:'+Math.max(2,x.v/mx*100)+'%"></i>'}).join('')+'</div><div class="axis"><span>'+esc(D.reachDaily[0].d)+'</span><span>max '+fmt(mx)+'</span><span>'+esc(D.reachDaily[D.reachDaily.length-1].d)+'</span></div></div>'}
  h+='<h2 class="sec">Reels <small>click a column to sort</small></h2><div class="tw" id="tbl"></div>';
  h+='<h2 class="sec">Audience</h2><div class="aud">'+[['Top countries','country',6],['Top cities','city',6],['Age','age',7],['Gender','gender',3]].map(function(x){return aud(x[0],D.demo[x[1]],x[2])}).join('')+'</div>';
  var er=Object.keys(D.errors||{});if(er.length)h+='<p class="note err">Instagram did not return: '+er.map(function(k){return esc(k)+' ('+esc(D.errors[k])+')'}).join('; ')+'</p>';
  $('out').innerHTML=h;table();
  $('foot').innerHTML='From Instagram, fetched '+new Date(D.fetchedAt).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})+'. Numbers can lag up to 48 hours. Reloads are cached for 10 minutes. &copy; Siteholder Records, Chicago. <a href="../">Back to admin</a>';
}
function followers(){
  var k=Object.keys(D.followers).sort(),W=1000,H=200,pad=34;
  if(!k.length)return '<p class="note">No data yet.</p>';
  var v=k.map(function(x){return D.followers[x]}),lo=Math.min.apply(null,v),hi=Math.max.apply(null,v);if(hi===lo){hi+=5;lo=Math.max(0,lo-5)}
  var x=function(i){return k.length===1?W/2:pad+i*(W-pad-10)/(k.length-1)},y=function(n){return H-24-(n-lo)/(hi-lo)*(H-50)};
  var path=v.map(function(n,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(n).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Followers over time"><g stroke="var(--line)"><line x1="'+pad+'" x2="'+W+'" y1="'+y(hi)+'" y2="'+y(hi)+'"/><line x1="'+pad+'" x2="'+W+'" y1="'+y(lo)+'" y2="'+y(lo)+'"/></g><g font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--muted)"><text x="0" y="'+(y(hi)+4)+'">'+hi+'</text><text x="0" y="'+(y(lo)+4)+'">'+lo+'</text><text x="'+pad+'" y="'+(H-4)+'">'+esc(k[0])+'</text><text x="'+W+'" y="'+(H-4)+'" text-anchor="end">'+esc(k[k.length-1])+'</text></g>'+(k.length>1?'<path d="'+path+'" fill="none" stroke="var(--ink)" stroke-width="2"/>':'')+'<circle cx="'+x(k.length-1)+'" cy="'+y(v[v.length-1])+'" r="4" fill="var(--ink)"/></svg>'+(k.length===1?'<p class="note">Tracking started today at '+fmt(v[0])+' followers. The line fills in as days pass.</p>':'');
}
function aud(t,rows,n){
  if(!rows||!rows.length)return '<div><h3>'+t+'</h3><p class="note">Not available yet (Instagram needs 100+ followers).</p></div>';
  var tot=rows.reduce(function(s,r){return s+r.v},0)||1;
  return '<div><h3>'+t+'</h3>'+rows.slice(0,n).map(function(r){var pc=Math.round(r.v/tot*100);return '<div class="ar"><span>'+esc(r.k)+'</span><s><i style="width:'+pc+'%"></i></s><span>'+pc+'%</span></div>'}).join('')+'</div>';
}
function table(){
  var cols=[['cap','Reel'],['date','Posted'],['views','Views'],['reach','Reach'],['likes','Likes'],['comments','Comments'],['shares','Shares'],['saves','Saves'],['watch','Avg watch'],['skip','Skipped']];
  var rows=(D.reels||[]).slice().sort(function(a,b){var x=a[sortK],y=b[sortK];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*sortDir});
  var sk=function(v){return v==null?'\u2014':Math.round(v<=1?v*100:v)+'%'};
  $('tbl').innerHTML='<table><thead><tr>'+cols.map(function(c){return '<th data-k="'+c[0]+'">'+c[1]+(c[0]===sortK?(sortDir<0?' \u2193':' \u2191'):'')+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+(r.thumb?'<img src="'+esc(r.thumb)+'" alt="" loading="lazy">':'<img alt="">')+'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.cap||'(no caption)')+'</a></td><td>'+esc(r.date.slice(5).replace('-','/'))+'</td><td>'+fmt(r.views)+'</td><td>'+fmt(r.reach)+'</td><td>'+fmt(r.likes)+'</td><td>'+fmt(r.comments)+'</td><td>'+fmt(r.shares)+'</td><td>'+fmt(r.saves)+'</td><td>'+(r.watch==null?'\u2014':(r.watch/1000).toFixed(1)+'s')+'</td><td>'+sk(r.skip)+'</td></tr>'}).join('')+'</tbody></table>';
  Array.prototype.forEach.call($('tbl').querySelectorAll('th'),function(th){th.onclick=function(){var k=th.getAttribute('data-k');if(k===sortK)sortDir=-sortDir;else{sortK=k;sortDir=k==='cap'?1:-1}table()}});
}
$('upd').onclick=function(){load(true)};
load(false);
(function(){
  var root=document.documentElement,btn=$('theme'),lab=$('theme-label');
  function eff(){var a=root.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
  function sync(){var d=eff()==='dark';btn.setAttribute('aria-checked',d);lab.textContent=d?'Dark':'Light'}
  btn.addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('sh-theme',n)}catch(e){}sync()});
  sync();
})();
(function(){var t=document.createElement('div');t.id='tip';document.body.appendChild(t);
document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){t.style.display='none';return}var p=el.getAttribute('data-tip').split('|');t.innerHTML=p[0]+': <b>'+Number(p[1]).toLocaleString()+'</b> accounts reached';t.style.display='block';var w=t.offsetWidth,x=Math.min(Math.max(8,e.clientX-w/2),innerWidth-w-8);t.style.left=x+'px';t.style.top=(el.getBoundingClientRect().top-t.offsetHeight-8)+'px'});
document.addEventListener('mouseleave',function(){t.style.display='none'});})();
</script>
</body></html>
