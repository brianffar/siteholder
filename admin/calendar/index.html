<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posting Calendar · Siteholder Records</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Siteholder Records Instagram posting calendar.">
<link rel="icon" href="../../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../icon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('sh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{color-scheme:light;
  --bg:#f2f3f4;--surface:#ffffff;--ink:#0e0f11;--muted:#5b5f66;--line:#d8dadd;--accent:#2536ff;--on-ink:#ffffff;--ok:#12805c;--bad:#c4271c;--warn:#a86a00;--hatch:#e9eaec;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px);--logo:url("../logo.png")}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--surface:#17181b;--ink:#f1f2f3;--muted:#9b9fa7;--line:#2b2d32;--accent:#8a95ff;--on-ink:#0e0f11;--ok:#41c796;--bad:#ff6b5e;--warn:#e8b040;--hatch:#1d1e22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f11;--surface:#17181b;--ink:#f1f2f3;--muted:#9b9fa7;--line:#2b2d32;--accent:#8a95ff;--on-ink:#0e0f11;--ok:#41c796;--bad:#ff6b5e;--warn:#e8b040;--hatch:#1d1e22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;padding-inline:var(--gutter)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin-inline:auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:14px}
.logo{display:block;height:56px;aspect-ratio:480/272;background-color:currentColor;-webkit-mask:var(--logo) no-repeat center/contain;mask:var(--logo) no-repeat center/contain}
.theme{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;padding:4px;cursor:pointer}
.theme:hover{color:var(--ink)}
.theme .track{width:38px;height:22px;border-radius:99px;border:1.5px solid var(--ink);position:relative;flex:none}
.theme .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .2s}
.theme[aria-checked="true"] .track::after{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.theme .track::after{transition:none}}
main{padding-block:32px 72px;min-height:100vh;min-height:100svh}
.back{font:12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-block;margin-bottom:14px}
.back:hover{color:var(--ink)}
.page-title{font-size:clamp(44px,9vw,120px);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;margin-bottom:12px}
.lede{color:var(--muted);max-width:68ch;margin-bottom:28px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);padding:16px 18px;position:relative}
.stat b{display:block;font-size:clamp(30px,4vw,44px);font-weight:800;font-stretch:75%;line-height:1;letter-spacing:-.01em}
.stat span{display:block;margin-top:8px;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat i{position:absolute;top:0;left:0;width:100%;height:3px}
.stat.next b{font-size:clamp(20px,2.4vw,26px);font-stretch:85%;line-height:1.1;text-transform:uppercase}
.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.month{font-size:clamp(26px,3.4vw,40px);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.nav{display:flex;gap:8px}
.btn{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:9px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn.sq{width:40px;padding:0;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.posted{background:var(--muted)}.dot.sched{background:var(--ok)}.dot.todo{background:var(--warn)}.dot.miss{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.dow{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cell{position:relative;min-height:128px;padding:8px 8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;text-align:left;font:inherit;color:inherit;background:var(--surface);border-top:0;border-left:0;cursor:pointer;min-width:0}
.cell:hover{background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
.cell.out{opacity:.38}
.cell.off{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,var(--surface) 6px 12px);cursor:default}
.cell.gap .num::after{content:"EMPTY";margin-left:8px;font:500 9px var(--mono);letter-spacing:.14em;color:var(--bad)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.cell .num{font:500 12px var(--mono);color:var(--muted)}
.cell.today .num{color:var(--on-ink);background:var(--accent);display:inline-block;align-self:flex-start;padding:1px 7px;border-radius:99px}
.cell.today.gap .num::after{color:var(--on-ink)}
.chip{display:block;border-left:3px solid var(--muted);background:color-mix(in srgb,var(--ink) 5%,transparent);padding:4px 7px 4px 8px;min-width:0}
.chip.sched{border-color:var(--ok)}.chip.todo{border-color:var(--warn)}.chip.miss{border-color:var(--bad)}.chip.posted{border-color:var(--muted)}
.chip .tm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip .tt{display:block;font-size:13px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.posted .tt{color:var(--muted);text-decoration:none}
.chip .ty{font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dots{display:none;gap:4px;flex-wrap:wrap}
@media(max-width:720px){
  .cell{min-height:58px;padding:6px 4px;align-items:center}
  .chip{display:none}.dots{display:flex;justify-content:center}
  .dow{padding:8px 2px;text-align:center;font-size:10px;letter-spacing:.04em}
  .cell.gap .num::after{content:"";}
  .cell.gap .num{color:var(--bad)}
}
.panel{background:var(--surface);border:1px solid var(--line);padding:22px}
.panel .k{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.panel h2{font-size:clamp(26px,3vw,34px);font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:1;letter-spacing:-.01em;margin-bottom:6px}
.panel .ar{color:var(--muted);margin-bottom:16px}
.pill{display:inline-block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid currentColor;margin:0 6px 14px 0}
.pill.sched{color:var(--ok)}.pill.todo{color:var(--warn)}.pill.miss{color:var(--bad)}.pill.posted{color:var(--muted)}
.item+.item{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.media{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-bottom:14px;align-items:start}
.media img{width:96px;height:96px;object-fit:cover;background:var(--hatch);display:block}
.facts{font:12px var(--mono);color:var(--muted);line-height:1.9}
.facts b{color:var(--ink);font-weight:500}
video{width:100%;max-height:360px;background:#000;display:block;margin-bottom:12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:8px 12px}
.links a:hover{border-color:var(--ink)}
.warnbox{border:1px solid var(--bad);color:var(--bad);font-size:14px;padding:10px 12px;margin-bottom:14px}
.empty{color:var(--muted)}
.side{display:grid;gap:24px}
.list h3{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;cursor:pointer}
.row:hover .rt{text-decoration:underline}
.row .rt{font-weight:700;font-size:14px;line-height:1.25;min-width:0}
.row .rd{font:11px var(--mono);color:var(--muted);white-space:nowrap}
footer{border-top:1px solid var(--line);padding-block:32px 48px}
.legal{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8}
.legal a{border-bottom:1px solid currentColor}.legal a:hover{color:var(--accent)}
.err{border:1px solid var(--bad);color:var(--bad);padding:16px}
</style></head><body>
<header class="top"><div class="wrap">
  <a class="brand" href="../../" aria-label="Siteholder Records home"><span class="logo" role="img" aria-label="siteHolder"></span></a>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span class="track"></span><span id="theme-label">Light</span></button>
</div></header>
<main class="wrap">
<a class="back" href="../">&larr; Admin</a>
<h1 class="page-title">Posting Calendar</h1>
<p class="lede" id="lede">Every Instagram post, by day. Click a day to see the post, play the reel and check what is missing. Wednesdays and Sundays are not posting days.</p>
<div class="sum" id="sum"></div>
<div class="layout">
  <section aria-label="Calendar">
    <div class="bar">
      <h2 class="month" id="month"></h2>
      <div class="nav"><button class="btn sq" id="prev" aria-label="Previous month" type="button">&larr;</button><button class="btn" id="today" type="button">Today</button><button class="btn sq" id="next" aria-label="Next month" type="button">&rarr;</button></div>
    </div>
    <div class="legend"><span><i class="dot posted"></i>Posted</span><span><i class="dot sched"></i>Scheduled</span><span><i class="dot todo"></i>To schedule</span><span><i class="dot miss"></i>Reel missing</span></div>
    <div class="grid" id="grid" role="grid"></div>
  </section>
  <aside class="side">
    <div class="panel" id="panel" aria-live="polite"></div>
    <div class="panel list" id="needs"></div>
    <div class="panel list" id="upnext"></div>
  </aside>
</div>
</main>
<footer><div class="wrap"><p class="legal" id="asof">&copy; Siteholder Records, Chicago. <a href="../">Back to the admin</a></p></div></footer>
<script>
var SHEET='https://docs.google.com/spreadsheets/d/1zE4oZ7jLhZAfK9lYzC-XOMzmU4CLyA-j4qvwg8JVDeg/edit#gid=';
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var TYPE={A:'Announcement',R:'Release',S:'Artist spotlight'};
var DATA,BY={},view,sel,todayKey;
function pad(n){return (n<10?'0':'')+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function parts(k){var a=k.split('-');return {y:+a[0],m:+a[1]-1,d:+a[2]}}
function nice(k,short){var p=parts(k),w=new Date(p.y,p.m,p.d).getDay();return DOW[w]+' '+(short?MON[p.m].slice(0,3):MON[p.m])+' '+p.d}
function cls(p){return p.miss?'miss':p.s==='Posted'?'posted':p.s==='Scheduled'?'sched':'todo'}
function label(p){return p.miss?'Reel missing':p.s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function title(p){return p.ty==='S'?p.cat:p.ti}
function sub(p){return p.ty==='S'?'Artist spotlight':p.ty==='A'?'Announcement':p.cat+' · '+p.ar}

function init(d){
  DATA=d;d.posts.forEach(function(p){(BY[p.d]=BY[p.d]||[]).push(p)});
  var n=new Date();todayKey=key(n.getFullYear(),n.getMonth(),n.getDate());
  var tp=parts(todayKey);view={y:tp.y,m:tp.m};
  if(!BY[todayKey]){var up=d.posts.filter(function(p){return p.d>=todayKey})[0];sel=up?up.d:null}else sel=todayKey;
  summary();draw();lists();document.getElementById('asof').innerHTML='&copy; Siteholder Records, Chicago. Schedule snapshot from the Master Sheet, '+esc(d.asOf)+'. <a href="'+SHEET+'900000001" target="_blank" rel="noopener">Open the Avery tab</a> &middot; <a href="../">Back to the admin</a>';
}
function summary(){
  var P=DATA.posts,c={Posted:0,Scheduled:0,'To schedule':0};P.forEach(function(p){c[p.s]++});
  var miss=P.filter(function(p){return p.miss&&p.d>=todayKey}).length;
  var nx=P.filter(function(p){return p.d>=todayKey})[0];
  var h='';
  h+='<div class="stat"><i style="background:var(--muted)"></i><b>'+c.Posted+'</b><span>Posted</span></div>';
  h+='<div class="stat"><i style="background:var(--ok)"></i><b>'+c.Scheduled+'</b><span>Scheduled</span></div>';
  h+='<div class="stat"><i style="background:var(--warn)"></i><b>'+c['To schedule']+'</b><span>To schedule</span></div>';
  h+='<div class="stat"><i style="background:var(--bad)"></i><b>'+miss+'</b><span>Reels missing</span></div>';
  if(nx)h+='<div class="stat next"><i style="background:var(--accent)"></i><b>'+esc(nice(nx.d,true))+'</b><span>Next: '+esc(title(nx))+'</span></div>';
  document.getElementById('sum').innerHTML=h;
}
function draw(){
  document.getElementById('month').textContent=MON[view.m]+' '+view.y;
  var first=new Date(view.y,view.m,1),start=first.getDay(),dim=new Date(view.y,view.m+1,0).getDate(),prevDim=new Date(view.y,view.m,0).getDate();
  var cells=Math.ceil((start+dim)/7)*7,h=DOW.map(function(d){return '<div class="dow" role="columnheader">'+d+'</div>'}).join('');
  for(var i=0;i<cells;i++){
    var y=view.y,m=view.m,d=i-start+1,out=false;
    if(d<1){m--;d=prevDim+d;out=true}else if(d>dim){m++;d=d-dim;out=true}
    if(m<0){m=11;y--}if(m>11){m=0;y++}
    var k=key(y,m,d),w=i%7,ps=BY[k]||[],off=(w===0||w===3);
    var c='cell'+(out?' out':'')+(k===todayKey?' today':'')+(k===sel?' sel':'')+(off&&!ps.length?' off':'');
    var gap=!off&&!ps.length&&!out&&k>=todayKey&&k<=DATA.posts[DATA.posts.length-1].d;
    if(gap)c+=' gap';
    var inner='<span class="num">'+d+'</span>';
    ps.forEach(function(p){inner+='<span class="chip '+cls(p)+'"><span class="tm">'+esc(p.t)+' · '+(p.ty==='S'?'Spotlight':p.ty==='A'?'Announce':'Release')+'</span><span class="tt">'+esc(title(p))+'</span></span>'});
    if(ps.length)inner+='<span class="dots">'+ps.map(function(p){return '<i class="dot '+cls(p)+'"></i>'}).join('')+'</span>';
    h+='<button type="button" class="'+c+'" data-k="'+k+'" role="gridcell" aria-label="'+esc(nice(k))+(ps.length?', '+ps.length+' post'+(ps.length>1?'s':''):off?', no post planned':', no posts')+'">'+inner+'</button>';
  }
  document.getElementById('grid').innerHTML=h;
  panel();
}
function panel(){
  var el=document.getElementById('panel');
  if(!sel){el.innerHTML='<p class="empty">Pick a day.</p>';return}
  var ps=BY[sel]||[],h='<div class="k">'+esc(nice(sel))+'</div>';
  if(!ps.length){
    var w=new Date(parts(sel).y,parts(sel).m,parts(sel).d).getDay();
    h+='<h2>'+(w===0||w===3?'No post planned':'Nothing scheduled')+'</h2><p class="empty">'+(w===0||w===3?'Wednesdays and Sundays are not posting days.':'No post is planned for this day.')+'</p>';
  }else ps.forEach(function(p){
    var r=p.r?DATA.reelBase+p.r+'.mp4':'',im=p.r?DATA.imgBase+p.r+'.png':'';
    h+='<div class="item"><h2>'+esc(title(p))+'</h2><p class="ar">'+esc(sub(p))+'</p>';
    h+='<span class="pill '+cls(p)+'">'+esc(label(p))+'</span>';
    if(p.miss)h+='<div class="warnbox">This post has no reel yet. Make it in the Reel &amp; Image Maker, upload it, then add the link in the sheet.</div>';
    h+='<div class="facts">Time <b>'+esc(p.t)+' CT</b><br>Type <b>'+esc(TYPE[p.ty])+'</b>'+(p.ty==='R'?'<br>Catalog <b>'+esc(p.cat)+'</b>':'')+'<br>Artist <b>'+esc(p.ar)+'</b><br>Post <b>#'+p.n+'</b> of '+DATA.posts.length+'</div>';
    if(r)h+='<video controls preload="none" playsinline src="'+r+'" style="margin-top:14px"></video><div class="links"><a href="'+r+'" target="_blank" rel="noopener">Reel &nearr;</a><a href="'+im+'" target="_blank" rel="noopener">Image &nearr;</a><a href="'+SHEET+'900000001" target="_blank" rel="noopener">Caption in sheet &nearr;</a></div>';
    else h+='<div class="links" style="margin-top:14px"><a href="../social/">Make the reel &rarr;</a><a href="'+SHEET+'900000001" target="_blank" rel="noopener">Sheet &nearr;</a></div>';
    h+='</div>';
  });
  el.innerHTML=h;
}
function lists(){
  var P=DATA.posts,miss=P.filter(function(p){return p.miss&&p.d>=todayKey});
  var nx=P.filter(function(p){return p.d>=todayKey&&!p.miss}).slice(0,6);
  function rows(a){return a.map(function(p){return '<button type="button" class="row" data-k="'+p.d+'"><span class="rt">'+esc(title(p))+'</span><span class="rd">'+esc(nice(p.d,true))+'</span></button>'}).join('')||'<p class="empty">None.</p>'}
  document.getElementById('needs').innerHTML='<h3>Needs attention ('+miss.length+')</h3>'+rows(miss);
  document.getElementById('upnext').innerHTML='<h3>Up next</h3>'+rows(nx);
}
function pick(k){
  sel=k;var p=parts(k);
  if(p.y!==view.y||p.m!==view.m){view={y:p.y,m:p.m}}
  draw();
  if(window.innerWidth<1000){var pn=document.getElementById('panel');pn.scrollIntoView({behavior:'smooth',block:'nearest'})}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-k]');if(b&&!b.classList.contains('off'))pick(b.getAttribute('data-k'));
});
function step(n){view.m+=n;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}draw()}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
document.getElementById('today').onclick=function(){var t=parts(todayKey);view={y:t.y,m:t.m};sel=BY[todayKey]?todayKey:sel;draw()};
fetch('schedule-snapshot.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(init).catch(function(){
  document.getElementById('sum').innerHTML='<div class="err">Could not load schedule-snapshot.json.</div>';
});
/* light / dark (shares the main site's choice) */
(function(){
  var root=document.documentElement,btn=document.getElementById('theme'),lab=document.getElementById('theme-label');
  function eff(){var t=root.getAttribute('data-theme');return t||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
  function sync(){var d=eff()==='dark';btn.setAttribute('aria-checked',d);lab.textContent=d?'Dark':'Light'}
  btn.addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('sh-theme',n)}catch(e){}sync()});
  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync)}catch(e){}}
  sync();
})();
</script>
</body></html>
